<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新标签页</title>
  <link rel="stylesheet" href="css/newtab.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div id="bg-preset" class="bg-preset skin-aurora"></div>
    <img id="bg-image" class="bg-image" alt="" draggable="false" />
  </div>
  <div class="dim" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <header class="clock-block">
      <time id="clock" class="clock">00:00</time>
      <p id="subline" class="subline"></p>
    </header>

    <div class="finder">
      <form id="search-form" class="search glass" role="search" autocomplete="off">
        <button type="button" id="engine-btn" class="engine-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="engine-label">必应</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input id="q" type="search" placeholder="搜索，或输入网址" autocomplete="off" spellcheck="false" aria-label="搜索" />
        <button type="submit" class="go" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <ul id="sug-list" class="sug-list" role="listbox" aria-label="搜索建议" hidden></ul>
      <ul id="engine-menu" class="engine-menu" role="listbox" hidden></ul>
    </div>

    <section id="grid" class="grid" aria-label="导航"></section>
  </main>

  <button type="button" id="edit-btn" class="fab glass" aria-label="编辑主页" aria-expanded="false" title="编辑主页">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.2V20h3.8L19.2 8.6l-3.8-3.8L4 16.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.2 6.9l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>

  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <h2>编辑主页</h2>
      <button type="button" id="panel-close" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="hint">此页会替换新标签页。若希望打开浏览器就看到它，请在浏览器设置里把启动页选为「新标签页」。</p>

    <h3>必应壁纸</h3>
    <p id="bing-status" class="status">正在获取必应壁纸…</p>
    <div id="bing-list" class="thumbs"></div>
    <div class="bing-bar">
      <button type="button" id="bing-more" class="text-btn" hidden></button>
      <label class="check-row"><input type="checkbox" id="bing-auto" checked />每日自动更新</label>
    </div>

    <h3>氛围</h3>
    <div id="preset-list" class="thumbs"></div>

    <h3>本地壁纸</h3>
    <div id="local-list" class="thumbs"></div>
    <p id="local-note" class="status"></p>
    <label class="upload">
      选择本地图片
      <input id="file" type="file" accept="image/*" hidden />
    </label>

    <label class="slider-row">
      <span>壁纸模糊</span>
      <input id="blur" type="range" min="0" max="30" step="1" value="0" aria-label="壁纸磨砂模糊强度" />
    </label>

    <button type="button" id="reset" class="text-btn">恢复默认</button>
    <p class="kbd-hint">悬停导航卡片可编辑、删除，拖动可排序。按 / 聚焦搜索，Esc 关闭。</p>
  </aside>

  <div id="backdrop" class="backdrop" hidden>
    <form id="site-form" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" novalidate>
      <h2 id="dialog-title">添加导航</h2>
      <label>
        名称
        <input id="site-name" type="text" maxlength="20" required autocomplete="off" />
      </label>
      <label>
        网址
        <input id="site-url" type="text" maxlength="300" required placeholder="https://" autocomplete="off" spellcheck="false" />
      </label>
      <p id="site-error" class="form-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" id="site-cancel" class="btn">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>

  <template id="tpl-site">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 12h18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
  </template>
  <template id="tpl-trash">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
  </template>
  <template id="tpl-pencil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
  </template>

  <template id="tpl-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  </template>

  <template id="tpl-history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
  </template>

  <script src="js/newtab.js"></script>
</body>
</html>
